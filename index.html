<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノーコードデータ管理プラットフォーム</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ノーコードデータ管理プラットフォーム</h1>
    </header>

    <main>
        <section id="app-switcher">
            <label for="app-select">アプリを選択:</label>
            <select id="app-select"></select>
        </section>

        <section id="form-section">
            <form id="dynamic-form"></form>
            <button type="submit" id="submit-button">追加</button>
        </section>

        <section id="search-section">
            <input type="text" id="search-box" placeholder="検索キーワード">
        </section>

        <section id="list-section">
            <table id="data-table">
                <thead><tr id="table-header"></tr></thead>
                <tbody></tbody>
            </table>
            <button id="export-csv">CSVエクスポート</button>
            <button id="backup-json">データバックアップ</button>
            <input type="file" id="restore-json" accept=".json">
        </section>

        <section id="definition-section">
            <button id="open-editor">アプリ定義エディタを開く</button>
            <input type="file" id="import-definition" accept=".json">
            <label for="import-definition">アプリ定義ファイルを読み込む</label>
        </section>
    </main>

    <footer>
        &copy; 2025 ノーコードプラットフォーム
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
